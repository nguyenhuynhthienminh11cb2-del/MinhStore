<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - MinhStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="logo">
        <h2>MinhStore</h2>
    </div>
    <nav>
        <ul class="menu">
            <li><a href="index.html">Trang chủ</a></li>
            <li><a href="sanpham.html">Sản phẩm</a></li>
            <li><a href="labthuchanh.html">Lab thực hành</a></li>
            <li><a href="giohang.html">🛒 Giỏ hàng</a></li>
            <li><a href="dangnhap.html">Đăng nhập</a></li>
        </ul>
    </nav>
</header>

<section class="auth-section">
    <div class="auth-container">
        <h1>Đăng ký tài khoản</h1>
        
        <div id="registerMsg" class="msg"></div>
        
        <!-- Thêm novalidate để tắt validation mặc định của trình duyệt -->
        <form id="registerForm" novalidate>
            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" id="fullname" placeholder="Nguyễn Văn A">
            </div>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="example@email.com">
            </div>
            
            <div class="form-group">
                <label>Số điện thoại</label>
                <input type="tel" id="phone" placeholder="xxxxxxxxxx">
            </div>
            
            <div class="form-group">
                <label>Địa chỉ</label>
                <input type="text" id="address" placeholder="Số nhà, đường, quận/huyện">
            </div>
            
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            
            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" placeholder="••••••••">
            </div>
            
            <button type="submit" class="auth-btn">Đăng ký</button>
        </form>
        
        <p class="auth-link">Đã có tài khoản? <a href="dangnhap.html">Đăng nhập ngay</a></p>
    </div>
</section>

<footer>
    <p>© 2025 MinhStore - Hỗ trợ học tập IT</p>
</footer>

<script src="js/taikhoan.js"></script>
</body>
</html>
